# Phase 4 Places Thresholds Configuration
# ----------------------------------------
# Controls Places-as-CRM promotion to MATCH_PLACES.
# Uses the same XGB decider as standard inference.
#
# Pool: recall@20 + arm_a + arm_b candidates
# NO_MATCH only after Places fails to promote.

version: "1.0"
calibrated_date: "2026-01-04"

# CRM mode for Places scoring:
# - "places": use Places title/address as CRM input (default)
# - "original": keep original CRM values
crm_mode: "places"

# ========================================
# Model paths (explicit, no auto-latest)
# ========================================
# Phase 4 requirement: use explicit paths, not auto-detection.

models:
  decider_model: "models/xgb_decider_20260124_210218.json"
  calibrator_path: "models/xgb_decider_calibrator_isotonic_20260124_210218.pkl"
  meta_path: "models/xgb_two_stage_meta_20260124_210218.json"
  ranker_fast_model: "models/xgbranker_fast_20260124_210218.json"

# ========================================
# Candidate pool configuration
# ========================================
# Pool = recall@20 from XGB + arm_a + arm_b from Places

pool:
  # XGB top-k to include in pool
  xgb_topk: 20

  # Maximum arm_a candidates (address-based)
  arm_a_max: 100

  # Maximum arm_b candidates (radius-based)
  arm_b_max: 50

  # Dedupe by SIRET
  dedupe: true

  # Filter candidates
  drop_unnamed: true
  exclude_closed: false  # Include closed for completeness

# ========================================
# CRM <-> Places gate (mini-gate)
# ========================================
# Validates Places result before using it as pseudo-CRM.

gate:
  # Postcode must match (required)
  require_postcode: true

  # Minimum address token overlap between CRM and Places
  min_addr_overlap: 0.35

  # Minimum name semantic similarity
  min_name_semantic: 0.50

  # Maximum Places position (1 = first result only)
  max_position: 2

  # Allow high address overlap to bypass name check
  addr_overlap_bypass: 0.80

# ========================================
# Promotion thresholds (calibrated)
# ========================================
# MATCH_PLACES promotion requires ALL conditions met:
# 1. Gate passed
# 2. address_close == true
# 3. score_places_top1 >= score_min
# 4. gap_places >= gap_min

promotion:
  # Minimum XGB score for top-1 Places candidate
  score_min: 0.97

  # Minimum gap between top-1 and top-2
  gap_min: 0.05

  # Minimum score ratio (top1 / top2)
  ratio_min: 1.03

# ========================================
# Address close validation
# ========================================
# address_close combines postcode + street address checks

address_close:
  # Minimum address Jaro similarity
  addr_jaro_min: 0.90

  # Minimum street name Jaro similarity
  street_name_jaro_min: 0.85

  # Maximum street number difference (0 = exact, 2 = nearby)
  street_number_diff_max: 2

  # OR: Maximum distance in meters (if coordinates available)
  distance_max_m: 80

  # Postcode must match exactly
  postcode_exact: true

# ========================================
# Segment-specific Places thresholds
# ========================================
# Adjust promotion thresholds based on segment

segments:
  # Complete address: we can trust Places more
  complete_address:
    conditions:
      address_complete: true
    score_min: 0.95
    gap_min: 0.03

  # Partial address: be more cautious
  partial_address:
    conditions:
      address_complete: false
    score_min: 0.98
    gap_min: 0.08

# ========================================
# Fallback behavior
# ========================================
# What to do when Places fails to promote

fallback:
  # Keep XGB top-1 as REVIEW (not promoted)
  keep_xgb_top1: true

  # Status when no promotion possible
  status: "NO_MATCH"

  # Minimum XGB score to keep as REVIEW (below = NO_MATCH)
  xgb_review_min: 0.50

# ========================================
# Semantic gating (from env)
# ========================================
# Same as XGB inference - uses XGB_SEMANTIC_ENABLED

semantic:
  # Use same gating as XGB inference
  gate_enabled: true
  gate_jaro_min: 0.50
  gate_token_min: 0.20

# ========================================
# Observability
# ========================================
# Metrics to track for Places-as-CRM

metrics:
  track_score_before_after: true
  track_gap_before_after: true
  track_top1_changed: true
  track_pool_sources: true
  track_gate_checks: true
  log_all_decisions: true
