# Phase 4 Routing Thresholds Configuration
# ------------------------------------------
# Controls AUTO/REVIEW routing decisions.
# NO_MATCH is only emitted AFTER Places processing.
#
# Calibrated on ground truth from Corbas/Decines + diversified dataset.
# Target: FP rate <= 0.1%, AUTO rate >= 60%

version: "1.0"
calibrated_date: "2026-01-04"

# ========================================
# Segment-based thresholds
# ========================================
# Each segment has specific thresholds based on risk profile.

segments:
  # Segment 1: Unique name + complete address
  # Places adds little value here - we can be more permissive for AUTO
  unique_name_full_addr:
    description: "High IDF name + complete street address"
    conditions:
      idf_name_min: 5.0
      address_complete: true
    threshold: 0.95
    gap_min: 0.03
    places_value: "low"

  # Segment 2: Common name + complete address
  # Moderate risk - address helps but name could match multiple entities
  common_name_full_addr:
    description: "Low IDF name + complete street address"
    conditions:
      idf_name_max: 5.0
      address_complete: true
    threshold: 0.98
    gap_min: 0.05
    places_value: "medium"

  # Segment 3: Unique name + partial address
  # Places can help find correct location
  unique_name_partial_addr:
    description: "High IDF name + incomplete address"
    conditions:
      idf_name_min: 5.0
      address_complete: false
    threshold: 0.97
    gap_min: 0.05
    places_value: "medium"

  # Segment 4: Common name + partial address
  # High risk - Places very useful here
  common_name_partial_addr:
    description: "Low IDF name + incomplete address"
    conditions:
      idf_name_max: 5.0
      address_complete: false
    threshold: 0.995
    gap_min: 0.08
    places_value: "high"

  # Segment 5: Very short names (1-2 words)
  # Always risky regardless of other factors
  short_name:
    description: "Name with 1-2 words only"
    conditions:
      name_word_count_max: 2
    threshold: 0.995
    gap_min: 0.10
    places_value: "high"

  # Default segment (fallback)
  default:
    description: "Fallback for unmatched cases"
    threshold: 0.99
    gap_min: 0.05
    places_value: "medium"

# ========================================
# Certainty rules (bypass thresholds)
# ========================================
# These rules identify cases where FP is theoretically impossible.
# They promote directly to AUTO without threshold checking.

certainty_rules:
  enabled: true

  # R1: Perfect lexical + address match
  perfect_match:
    enabled: true
    name_jaro_min: 0.98
    name_token_overlap_min: 0.90
    addr_jaro_min: 0.98
    street_number_diff_max: 0
    score_min: 0.90

  # R2: Identical name (jaro=1.0) + high score + gap check
  # FIX: Added gap_min to prevent homonyme FPs (e.g., "CABANON", "SCHLUMBERGER")
  identical_name:
    enabled: true
    name_jaro_exact: 1.0
    score_min: 0.95
    gap_min: 0.05  # Require at least 5% gap to avoid homonyme FPs

  # R3: Model certainty + lexical evidence
  model_certainty:
    enabled: true
    score_min: 0.999
    name_jaro_min: 0.90
    name_token_overlap_min: 0.70

  # R4: Contains match + high score + address match
  contains_match:
    enabled: true
    name_crm_contains_cand_min: 0.95
    score_min: 0.95
    addr_jaro_min: 0.80

# ========================================
# Same-SIREN resolution
# ========================================
# When top candidates share the same SIREN (same company, different establishments),
# resolve automatically by preferring OUVERT over FERME.

same_siren_resolution:
  enabled: true
  min_score: 0.90
  min_name_jaro: 0.80
  prefer_ouvert: true
  # If score gap between same-SIREN candidates is small, auto-resolve
  auto_resolve_gap_max: 0.10

# ========================================
# Blocking rules (force REVIEW)
# ========================================
# These rules override promotion and force REVIEW even with high scores.

blocking_rules:
  # B1: No lexical evidence at all
  no_lexical_evidence:
    enabled: true
    name_jaro_max: 0.50
    name_token_overlap_max: 0.20

  # B2: Semantic-only match (no lexical support)
  semantic_only:
    enabled: true
    score_bypass: 0.998  # Allow very high scores through
    name_jaro_max: 0.60
    name_sim_max_etab_max: 0.50
    name_crm_contains_cand_max: 0.50
    name_sim_max_pm_dirigeant_max: 0.50
    name_token_overlap_max: 0.45

  # B3: Address-only match (co-location risk)
  address_only:
    enabled: true
    name_token_overlap_max: 0.10
    addr_token_overlap_min: 0.80

  # B4: High address density (shopping center, ZI)
  high_density:
    enabled: true
    address_density_min: 10
    name_jaro_max: 0.80

  # B5: Weak gap (high ambiguity)
  weak_gap:
    enabled: true
    score_gap_max: 0.05
    score_ratio_max: 1.02

  # B6: No name evidence flag
  no_name_evidence:
    enabled: true
    has_name_evidence: false

# ========================================
# Promotion rules (force AUTO)
# ========================================
# Additional rules beyond certainty that promote to AUTO.

promotion_rules:
  # P1: Strong establishment match
  strong_etab:
    enabled: true
    score_min: 0.95
    name_sim_max_etab_min: 0.70

  # P2: Contains match
  contains:
    enabled: true
    score_min: 0.90
    name_crm_contains_cand_min: 0.90

  # P3: PM dirigeant match
  pm_dirigeant:
    enabled: true
    score_min: 0.95
    name_sim_max_pm_dirigeant_min: 0.70

  # P4: High token overlap
  token_overlap:
    enabled: true
    score_min: 0.98
    name_token_overlap_min: 0.50

# ========================================
# Budget modes
# ========================================
# Adjust thresholds based on Places API budget constraints.

budget:
  mode: "normal"  # aggressive | normal | permissive

  # Modifiers applied to thresholds per mode
  aggressive:
    # Minimize Places calls - more permissive for AUTO
    threshold_multiplier: 0.995
    gap_multiplier: 0.80

  normal:
    # Balanced approach
    threshold_multiplier: 1.0
    gap_multiplier: 1.0

  permissive:
    # Maximize recall - more strict for AUTO
    threshold_multiplier: 1.005
    gap_multiplier: 1.20

  # Monthly limits
  max_monthly_calls: 2500  # Serper free tier
  alert_threshold: 0.80   # Alert at 80% usage
  cost_per_call: 0.001    # USD per API call

# ========================================
# Output labels
# ========================================
# Phase 4: Only AUTO or REVIEW before Places
# NO_MATCH is only possible AFTER Places processing

output_labels:
  auto: "AUTO"
  auto_certain: "AUTO_CERTAIN"
  auto_same_siren: "AUTO_SAME_SIREN"
  auto_budget: "AUTO_BUDGET"
  review: "REVIEW"
  review_low_places_value: "REVIEW_LOW_PLACES_VALUE"
  review_same_siren: "REVIEW_SAME_SIREN"
  # NO_MATCH only after Places
  no_match: "NO_MATCH"
